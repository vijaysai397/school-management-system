{% extends 'base.html' %}{% block title %}Library card{% endblock %}{% block content %}<p class="eyebrow">Library</p><h1>New library card</h1><form class="data-form" method="post"><div class="form-grid"><div class="field"><label>Card number</label><input name="card_number" required></div><div class="field"><label>Student</label><select name="student_id" required>{% for student in students %}<option value="{{ student.id }}">{{ student.admission_number }} - {{ student.full_name }}</option>{% endfor %}</select></div><div class="field"><label>Issue date</label><input name="issue_date" type="date" required></div><div class="field"><label>Expiry date</label><input name="expiry_date" type="date"></div></div><button class="button" type="submit">Create card</button></form>{% endblock %}

{% extends 'base.html' %}{% block title %}Student form{% endblock %}{% block content %}<p class="eyebrow">Student module</p><h1>{{ 'Edit' if student_id else 'Add' }} student</h1><form class="data-form" method="post" enctype="multipart/form-data"><div class="form-grid">{% for name, label, input_type, required in fields %}<div class="field {% if input_type == 'textarea' %}full{% endif %}"><label for="{{ name }}">{{ label }}</label>{% if input_type == 'textarea' %}<textarea id="{{ name }}" name="{{ name }}">{{ student[name] if student else '' }}</textarea>{% else %}<input id="{{ name }}" name="{{ name }}" type="{{ input_type }}" value="{{ student[name] if student else '' }}" {% if required %}required{% endif %}>{% endif %}</div>{% endfor %}<div class="field"><label for="photo">Photo</label><input id="photo" name="photo" type="file" accept="image/*"></div></div><button class="button" type="submit">Save student</button></form>{% endblock %}

{% extends 'base.html' %}{% block title %}Add faculty{% endblock %}{% block content %}<p class="eyebrow">Administration</p><h1>Add faculty</h1><form class="data-form" method="post" enctype="multipart/form-data"><div class="form-grid">{% for name, label in fields %}<div class="field {% if name == 'address' %}full{% endif %}"><label>{{ label }}</label>{% if name == 'address' %}<textarea name="{{ name }}"></textarea>{% else %}<input name="{{ name }}" type="text">{% endif %}</div>{% endfor %}<div class="field"><label>Photo</label><input name="photo" type="file" accept="image/*"></div></div><button class="button" type="submit">Save faculty</button></form>{% endblock %}

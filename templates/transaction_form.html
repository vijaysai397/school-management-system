{% extends 'base.html' %}{% block title %}Issue book{% endblock %}{% block content %}<p class="eyebrow">Library</p><h1>Issue book</h1><form class="data-form" method="post"><div class="form-grid"><div class="field"><label>Book</label><select name="book_id" required>{% for book in books %}<option value="{{ book.id }}">{{ book.title }} ({{ book.available_copies }} available)</option>{% endfor %}</select></div><div class="field"><label>Student</label><select name="student_id" required>{% for student in students %}<option value="{{ student.id }}">{{ student.full_name }}</option>{% endfor %}</select></div><div class="field"><label>Issue date</label><input name="issue_date" type="date" required></div><div class="field"><label>Due date</label><input name="due_date" type="date"></div></div><button class="button" type="submit">Issue book</button></form>{% endblock %}
